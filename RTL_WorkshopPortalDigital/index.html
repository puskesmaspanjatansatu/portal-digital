
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4565f5">
  <title>Kesan · Pesan · Rencana</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f5fc;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f5fc;
      opacity: 0;
      transition: opacity .5s ease;
    }

    #app.show {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 15% 15%,
          rgba(83, 105, 255, .12), transparent 35%),
        radial-gradient(circle at 85% 85%,
          rgba(12, 190, 180, .12), transparent 35%),
        #f5f7fd;
      transition: opacity .55s ease, visibility .55s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .content {
      width: min(88%, 360px);
      text-align: center;
      color: #17223c;
      animation: appear .65s ease both;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 23px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: white;
      background: linear-gradient(145deg, #5265f5, #00b9b1);
      box-shadow: 0 10px 25px rgba(68, 93, 225, .22);
      animation: float 2.2s ease-in-out infinite;
    }

    .logo svg {
      width: 31px;
      height: 31px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      margin-bottom: 9px;
      color: #596ce7;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.7px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 9px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.2;
      letter-spacing: -.7px;
      font-weight: 750;
    }

    .subtitle {
      color: #6d7892;
      font-size: 13px;
      line-height: 1.6;
    }

    .loading {
      width: 220px;
      max-width: 100%;
      margin: 30px auto 0;
    }

    .track {
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 10px;
      background: #e2e7f5;
    }

    #bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #5265f5, #08bdb2);
      transition: width .25s ease;
    }

    #status {
      margin-top: 12px;
      color: #8490a8;
      font-size: 11px;
      letter-spacing: .3px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div id="loader">
    <div class="content">

      <div class="logo">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.8l1.9 5.3 5.3 1.9-5.3 1.9-1.9 5.3-1.9-5.3-5.3-1.9 5.3-1.9L12 2.8z"/>
          <path d="M19 15.5l1 2.5 2.2 1-2.2.8-1 2.2-.8-2.2-2.2-.8 2.2-1 0.8-2.5z"/>
        </svg>
      </div>

      <div class="eyebrow">Workshop Transformasi Digital</div>
      <h1>Kesan · Pesan · Rencana</h1>
      <p class="subtitle">
        Dinkes &amp; APKESMI Kabupaten Kulon Progo
      </p>

      <div class="loading">
        <div class="track">
          <div id="bar"></div>
        </div>
        <div id="status">Menyiapkan aplikasi...</div>
      </div>

    </div>
  </div>

  <iframe
    id="app"
    title="Aplikasi Kesan Pesan Rencana"
    src="https://script.google.com/macros/s/AKfycbzgukh0b1ep2DeNQd1uwey5ug5i_jdP9fFM6Q9_aOAOrK_6QtbFx9qmfbsaqiOmb14/exec"
    allow="camera; microphone; geolocation"
    loading="eager">
  </iframe>

  <script>
    const app = document.getElementById("app");
    const loader = document.getElementById("loader");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");

    let progress = 0;
    let completed = false;

    const timer = setInterval(() => {
      if (completed) {
        clearInterval(timer);
        return;
      }

      progress = Math.min(progress + Math.random() * 7, 90);
      bar.style.width = progress + "%";
    }, 180);

    function finishLoading() {
      if (completed) return;
      completed = true;
      clearInterval(timer);

      bar.style.width = "100%";
      status.textContent = "Aplikasi siap";

      setTimeout(() => {
        app.classList.add("show");
        loader.classList.add("hide");
      }, 350);
    }

    app.addEventListener("load", finishLoading);

    // Pengaman jika iframe lambat merespons.
    // Timeout bukan jaminan aplikasi sudah selesai dimuat.
    setTimeout(() => {
      if (!completed) finishLoading();
    }, 10000);
  </script>

</body>
</html>
