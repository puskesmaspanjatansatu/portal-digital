<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarif Layanan BLUD Puskesmas Panjatan I</title>

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:system-ui;
background:#020617;
overflow:hidden;
transition:.3s;
}

/* iframe */
iframe{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
background:#fff;
}

/* LOADER */
#loader{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
background:radial-gradient(circle at center,#0ea5e9,#020617);
}

/* CARD */
.card{
width:90%;
max-width:380px;
padding:30px;
border-radius:24px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
color:#ffffff;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.8);
}

/* TEXT */
.title{
font-size:18px;
color:#ffffff;
font-weight:bold;
margin-bottom:8px;
text-shadow:0 0 10px rgba(0,0,0,.8);
}

.sub{
font-size:13px;
color:#e2e8f0;
text-shadow:0 0 6px rgba(0,0,0,.8);
}

/* ===== ANIMASI TARIF ===== */
.tarif{
position:relative;
height:120px;
margin:25px 0;
}

/* koin */
.coin{
position:absolute;
width:50px;
height:50px;
border-radius:50%;
background:linear-gradient(145deg,#facc15,#eab308);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:#78350f;
left:50%;
top:10%;
transform:translateX(-50%);
box-shadow:0 0 20px rgba(250,204,21,.9);
animation:drop 1.5s infinite;
}

/* garis */
.bar-line{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:120px;
height:8px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
}

.bar-fill{
height:100%;
width:40%;
background:linear-gradient(90deg,#38bdf8,#22c55e);
animation:load 1.5s infinite;
}

/* angka */
.price{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
font-size:14px;
color:#22c55e;
font-weight:bold;
animation:pulse 1.5s infinite;
}

/* animasi */
@keyframes drop{
0%{top:10%;opacity:0}
50%{top:50%;opacity:1}
100%{top:30%}
}

@keyframes load{
0%{transform:translateX(-120%)}
100%{transform:translateX(300%)}
}

@keyframes pulse{
0%,100%{transform:translateX(-50%) scale(1)}
50%{transform:translateX(-50%) scale(1.1)}
}

/* hide */
.hide{
opacity:0;
visibility:hidden;
transition:.6s;
}

/* HOME BUTTON */
.home{
position:fixed;
bottom:18px;
right:18px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:rgba(15,23,42,.6);
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(10px);
z-index:99999;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.home:hover{
background:#38bdf8;
transform:translateY(-4px) scale(1.05);
}

.home svg{
width:26px;
fill:#fff;
}

</style>

</head>

<body>

<!-- WEB APP -->
<iframe
id="app"
src="https://script.google.com/macros/s/AKfycbywVJor_uUrMFsQ-dMBl051imaVctlJcWHBa842RLNhKmSw2HJIwMVTHEMh0ON_vuDfwg/exec">
</iframe>

<!-- LOADER -->
<div id="loader">
<div class="card">

<div class="title">TARIF LAYANAN BLUD</div>
<div class="sub">Puskesmas Panjatan I</div>

<div class="tarif">
<div class="coin">Rp</div>
<div class="price">Memuat Tarif...</div>

<div class="bar-line">
<div class="bar-fill"></div>
</div>
</div>

<div class="sub">
Menampilkan informasi tarif layanan<br>
sesuai regulasi daerah
</div>

</div>
</div>

<!-- HOME -->
<a href="https://puskesmaspanjatansatu.github.io/portal-digital/" 
class="home"
onclick="fadeOut()">
<svg viewBox="0 0 24 24">
<path d="M12 3.1 2.6 11a1 1 0 0 0 .64 1.77H5v7a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-7h1.76A1 1 0 0 0 21.4 11L12 3.1z"/>
</svg>
</a>

<script>

const loader=document.getElementById("loader");

document.getElementById("app").onload=()=>{
setTimeout(()=>loader.classList.add("hide"),600);
};

setTimeout(()=>loader.classList.add("hide"),7000);

function fadeOut(){
document.body.style.opacity="0";
}

</script>

</body>
</html>
