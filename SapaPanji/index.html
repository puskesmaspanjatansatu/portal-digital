<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>SAPA PANJI V2</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
background:#020617;
}

/* IFRAME */

iframe{
position:fixed;
inset:0;
width:100%;
height:100%;
border:none;
}

/* LOADER */

.loader{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;

background:radial-gradient(circle at top,#0ea5e9,#020617 70%);
z-index:9999;
transition:.6s;
}

.hide{
opacity:0;
visibility:hidden;
}

.card{
width:92%;
max-width:420px;
padding:30px 25px;
text-align:center;
border-radius:30px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid #38bdf833;

color:#e0f2fe;
box-shadow:0 20px 60px #0008;
}

/* ICON */

.icon{
width:90px;
height:90px;
margin:auto;
border-radius:50%;

background:linear-gradient(135deg,#0ea5e9,#10b981);

display:flex;
align-items:center;
justify-content:center;

font-size:40px;
color:white;

box-shadow:0 0 30px #0ea5e966;
animation:pulse 2s infinite;
}

/* TEXT */

h1{
margin-top:18px;
font-size:1.6rem;
color:#7dd3fc;
}

p{
margin-top:10px;
font-size:.95rem;
color:#e0f2fe;
line-height:1.6;
}

/* PROGRESS */

.progress{
margin-top:20px;
height:8px;
border-radius:20px;
background:#0c4a6e;
overflow:hidden;
}

.bar{
height:100%;
width:40%;
background:#38bdf8;
animation:load 1.2s infinite;
}

/* FALLBACK BUTTON */

.fallback{
margin-top:18px;
display:none;
}

.fallback a{
display:inline-block;
padding:10px 16px;
border-radius:10px;
background:#10b981;
color:white;
text-decoration:none;
font-size:.9rem;
}

/* ANIMATION */

@keyframes load{
0%{transform:translateX(-120%)}
100%{transform:translateX(300%)}
}

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.1);}
}

/* ========================= */
/* BACK HOME BUTTON */
/* ========================= */

.back-home{
position:fixed;
right:calc(18px + env(safe-area-inset-right,0px));
bottom:calc(18px + env(safe-area-inset-bottom,0px));

width:48px;
height:48px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:rgba(2,6,23,.55);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.18);

color:white;
text-decoration:none;

z-index:99999;

box-shadow:0 8px 24px rgba(0,0,0,.28);

transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
cursor:pointer;
}

.back-home svg{width:20px;height:20px;fill:#fff;opacity:.9}

.back-home:hover{
transform:translateY(-3px);
background:rgba(14,165,233,.85);
box-shadow:0 12px 28px rgba(14,165,233,.4);
}

.back-home:active{
transform:scale(.94);
}

/* MOBILE */

@media(max-width:600px){
.back-home{
width:44px;
height:44px;
right:calc(14px + env(safe-area-inset-right,0px));
bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
.back-home svg{width:18px;height:18px}
}

</style>
</head>

<body>

<!-- IFRAME -->

<iframe
id="app"
src="https://script.google.com/macros/s/AKfycby8Sy8rsCOElwELMykqkmqFUkrEc4dOeumGppQIx4x0-SVUfITgAEsOt60LhNPYRtljHA/exec">
</iframe>

<!-- LOADER -->

<div class="loader" id="loader">

<div class="card">

<div class="icon">💬</div>

<h1>SAPA PANJI</h1>

<p>
Aspirasi & Pengaduan<br>
Puskesmas Panjatan I
</p>

<div class="progress">
<div class="bar"></div>
</div>

<p id="status">Memuat aplikasi...</p>

<div class="fallback" id="fallback">
<a href="https://script.google.com/macros/s/AKfycby8Sy8rsCOElwELMykqkmqFUkrEc4dOeumGppQIx4x0-SVUfITgAEsOt60LhNPYRtljHA/exec">
Buka Langsung
</a>
</div>

</div>

</div>

<!-- BACK HOME -->

<a href="https://puskesmaspanjatansatu.github.io/portal-digital/" class="back-home" id="backHomeBtn" title="Kembali ke Portal Digital" aria-label="Kembali ke Portal Digital">
<svg viewBox="0 0 24 24"><path d="M12 3.1 2.6 11a1 1 0 0 0 .64 1.77H5v7.13a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-7.13h1.76A1 1 0 0 0 21.4 11L12 3.1z"/></svg>
</a>

<!-- SCRIPT -->

<script>

const loader = document.getElementById("loader");
const fallback = document.getElementById("fallback");
const statusText = document.getElementById("status");

// jika iframe berhasil load
document.getElementById("app").onload = function(){
setTimeout(()=>{
loader.classList.add("hide");
},500);
};

// fallback jika gagal
setTimeout(()=>{
statusText.innerText = "Jika tidak terbuka, klik tombol di bawah";
fallback.style.display = "block";
},5000);

// hide paksa
setTimeout(()=>{
loader.classList.add("hide");
},8000);

/* TOMBOL KEMBALI: coba tutup tab ini dulu (kembali ke tab e-Portal Digital
   yang sudah terbuka sebelumnya, karena aplikasi dibuka via target="_blank"
   dari portal). Kalau browser tidak mengizinkan tab ditutup (mis. dibuka
   langsung lewat bookmark/ketik URL, bukan dari portal), baru pindah ke
   portal di tab ini sebagai cadangan. */
document.getElementById("backHomeBtn").addEventListener("click", function(e){
  e.preventDefault();
  var fallbackUrl = this.href;
  window.close();
  setTimeout(function(){
    location.href = fallbackUrl;
  }, 300);
});

</script>

</body>
</html>
