<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMKEU BLUD - Verifikasi Tautan</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2F4A33 0%, #3D7A6B 100%);
        padding: 20px;
    }
    .card {
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        border-top: 4px solid #C9A227;
    }
    .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2F4A33, #3D7A6B);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .icon svg { width: 30px; height: 30px; }
    h1 {
        font-size: 18px;
        color: #2F4A33;
        margin-bottom: 6px;
        font-weight: 700;
    }
    p {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 24px;
        line-height: 1.5;
    }
    .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(61, 122, 107, 0.15);
        border-top-color: #3D7A6B;
        border-radius: 50%;
        margin: 0 auto 16px;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 12px; color: #94a3b8; font-weight: 600; letter-spacing: 0.02em; }
    .error-box {
        display: none;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: 16px;
        margin-top: 16px;
        text-align: left;
    }
    .error-box p { color: #A8462F; font-size: 12.5px; margin: 0; }
    .footer {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #f1f5f9;
        font-size: 11px;
        color: #94a3b8;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1>SIMKEU BLUD</h1>
        <p>UPT Puskesmas Panjatan I</p>

        <div id="loadingState">
            <div class="spinner"></div>
            <p class="status">Memverifikasi tautan, mohon tunggu...</p>
        </div>

        <div id="errorState" class="error-box">
            <p>Tautan tidak valid atau sudah kedaluwarsa. Silakan minta tautan reset kata sandi baru lewat halaman login SIMKEU BLUD.</p>
        </div>

        <div class="footer">Dinas Kesehatan Kabupaten Kulon Progo</div>
    </div>

    <script>
        // URL Web App SIMKEU BLUD (tetap sama selama deployment di-update lewat
        // "New version" pada deployment yang sama, bukan membuat deployment baru).
        var SIMKEU_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwOkrajQUd0LoCq4AeAK1RSgG5NLgYGyEVHvjCpS0ZQCogXEviMNMwla2u-6fOsMY-X/exec';

        var params = new URLSearchParams(window.location.search);
        var token = params.get('token');

        if (!token) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        } else {
            setTimeout(function () {
                window.location.href = SIMKEU_EXEC_URL + '?token=' + encodeURIComponent(token);
            }, 700);
        }
    </script>
</body>
</html>
