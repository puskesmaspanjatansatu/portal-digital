<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>SAPA PANJI V2</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Segoe UI',sans-serif;
background:#020617;
}

/* IFRAME */

iframe{
position:fixed;
inset:0;
width:100%;
height:100%;
border:none;
}

/* LOADER */

.loader{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;

background:radial-gradient(circle at top,#831843,#020617 70%);
z-index:9999;
transition:.6s;
}

.hide{
opacity:0;
visibility:hidden;
}

.card{
width:92%;
max-width:420px;
padding:30px 25px;
text-align:center;
border-radius:30px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid #f472b640;

color:#fce7f3;
box-shadow:0 20px 60px #0008;
}

/* ICON + SPINNER RING */

.icon-wrap{
position:relative;
width:100px;
height:100px;
margin:0 auto;
}

.spinner-ring{
position:absolute;
inset:0;
border-radius:50%;
background:conic-gradient(from 0deg,transparent 0%,#fb7185 30%,#fbbf24 55%,transparent 78%);
animation:spin 1.35s linear infinite;
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 5px));
mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 5px));
filter:drop-shadow(0 0 10px rgba(244,114,182,.5));
}

.spinner-ring::after{
content:"";
position:absolute;
inset:0;
border-radius:50%;
border:1px solid rgba(251,191,36,.2);
}

.icon{
position:absolute;
inset:9px;
border-radius:50%;

background:linear-gradient(135deg,#fb7185,#f472b6 55%,#fbbf24);

display:flex;
align-items:center;
justify-content:center;

color:white;

box-shadow:0 0 30px rgba(244,114,182,.5);
animation:pulse 2s ease-in-out infinite;
}

.icon svg{
width:46px;
height:46px;
}

.orbit-dot{
position:absolute;
top:50%;
left:50%;
width:8px;
height:8px;
border-radius:50%;
background:#fda4af;
box-shadow:0 0 10px #fb7185;
transform-origin:0 0;
animation:orbit 1.35s linear infinite;
}
.orbit-dot:nth-child(3){animation-delay:-.45s}
.orbit-dot:nth-child(4){animation-delay:-.9s}

@keyframes spin{to{transform:rotate(360deg)}}

@keyframes orbit{
from{transform:rotate(0deg) translateX(50px) rotate(0deg)}
to{transform:rotate(360deg) translateX(50px) rotate(-360deg)}
}

/* TYPING DOTS (kesan "sedang memproses pesan") */

.typing{
margin-top:16px;
display:flex;
justify-content:center;
gap:6px;
}
.typing span{
width:8px;
height:8px;
border-radius:50%;
background:#fb7185;
box-shadow:0 0 8px #fb718599;
animation:bounce 1.1s ease-in-out infinite;
}
.typing span:nth-child(2){animation-delay:.15s;background:#f472b6}
.typing span:nth-child(3){animation-delay:.3s;background:#fbbf24}

@keyframes bounce{
0%,60%,100%{transform:translateY(0);opacity:.5}
30%{transform:translateY(-9px);opacity:1}
}

/* TEXT */

h1{
margin-top:18px;
font-size:1.6rem;
color:#fda4af;
}

p{
margin-top:10px;
font-size:.95rem;
color:#fce7f3;
line-height:1.6;
}

/* FALLBACK BUTTON */

.fallback{
margin-top:18px;
display:none;
}

.fallback a{
display:inline-block;
padding:10px 16px;
border-radius:10px;
background:linear-gradient(135deg,#fb7185,#f472b6);
color:white;
text-decoration:none;
font-size:.9rem;
}

/* ANIMATION */

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.1);}
}

/* ========================= */
/* BACK HOME BUTTON */
/* ========================= */

.back-home{
position:fixed;
right:calc(18px + env(safe-area-inset-right,0px));
bottom:calc(18px + env(safe-area-inset-bottom,0px));

width:48px;
height:48px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:rgba(2,6,23,.55);
backdrop-filter:blur(10px);
-webkit-backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.18);

color:white;
text-decoration:none;

z-index:99999;

box-shadow:0 8px 24px rgba(0,0,0,.28);

transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
cursor:pointer;
}

.back-home svg{width:20px;height:20px;fill:#fff;opacity:.9}

.back-home:hover{
transform:translateY(-3px);
background:rgba(244,114,182,.85);
box-shadow:0 12px 28px rgba(244,114,182,.4);
}

.back-home:active{
transform:scale(.94);
}

/* MOBILE */

@media(max-width:600px){
.back-home{
width:44px;
height:44px;
right:calc(14px + env(safe-area-inset-right,0px));
bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
.back-home svg{width:18px;height:18px}
}

</style>
</head>

<body>

<!-- IFRAME -->

<iframe
id="app"
src="https://script.google.com/macros/s/AKfycby8Sy8rsCOElwELMykqkmqFUkrEc4dOeumGppQIx4x0-SVUfITgAEsOt60LhNPYRtljHA/exec">
</iframe>

<!-- LOADER -->

<div class="loader" id="loader">

<div class="card">

<div class="icon-wrap">
<div class="spinner-ring"></div>
<div class="orbit-dot"></div>
<div class="orbit-dot"></div>
<div class="orbit-dot"></div>
<div class="icon">
<svg viewBox="0 0 24 24" fill="none">
<defs>
<linearGradient id="sapaIconGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff"/>
<stop offset="1" stop-color="#ffe4ec"/>
</linearGradient>
</defs>
<path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" fill="url(#sapaIconGrad)"/>
<path d="M12 9.6c-.6-1-1.7-1.6-2.8-1.4-1.3.2-2.2 1.4-2.1 2.7.2 2 2.6 3.6 4.9 4.9 2.3-1.3 4.7-2.9 4.9-4.9.1-1.3-.8-2.5-2.1-2.7-1.1-.2-2.2.4-2.8 1.4z" fill="#fb7185"/>
</svg>
</div>
</div>

<h1>SAPA PANJI</h1>

<p>
Aspirasi & Pengaduan<br>
Puskesmas Panjatan I
</p>

<div class="typing"><span></span><span></span><span></span></div>

<p id="status">Memuat aplikasi...</p>

<div class="fallback" id="fallback">
<a href="https://script.google.com/macros/s/AKfycby8Sy8rsCOElwELMykqkmqFUkrEc4dOeumGppQIx4x0-SVUfITgAEsOt60LhNPYRtljHA/exec">
Buka Langsung
</a>
</div>

</div>

</div>

<!-- BACK HOME -->

<a href="https://puskesmaspanjatansatu.github.io/portal-digital/" class="back-home" id="backHomeBtn" title="Kembali ke Portal Digital" aria-label="Kembali ke Portal Digital">
<svg viewBox="0 0 24 24"><path d="M12 3.1 2.6 11a1 1 0 0 0 .64 1.77H5v7.13a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-7.13h1.76A1 1 0 0 0 21.4 11L12 3.1z"/></svg>
</a>

<!-- SCRIPT -->

<script>

const loader = document.getElementById("loader");
const fallback = document.getElementById("fallback");
const statusText = document.getElementById("status");

// jika iframe berhasil load
document.getElementById("app").onload = function(){
setTimeout(()=>{
loader.classList.add("hide");
},500);
};

// fallback jika gagal
setTimeout(()=>{
statusText.innerText = "Jika tidak terbuka, klik tombol di bawah";
fallback.style.display = "block";
},5000);

// hide paksa
setTimeout(()=>{
loader.classList.add("hide");
},8000);

/* TOMBOL KEMBALI: coba tutup tab ini dulu (kembali ke tab e-Portal Digital
   yang sudah terbuka sebelumnya, karena aplikasi dibuka via target="_blank"
   dari portal). Kalau browser tidak mengizinkan tab ditutup (mis. dibuka
   langsung lewat bookmark/ketik URL, bukan dari portal), baru pindah ke
   portal di tab ini sebagai cadangan. */
document.getElementById("backHomeBtn").addEventListener("click", function(e){
  e.preventDefault();
  var fallbackUrl = this.href;
  window.close();
  setTimeout(function(){
    location.href = fallbackUrl;
  }, 300);
});

</script>

</body>
</html>
